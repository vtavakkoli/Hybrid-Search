services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "4633:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: elastic_db
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "4920:9200"
    volumes:
      - ./es_data:/usr/share/elasticsearch/data

  queryweave:
    build:
      context: https://github.com/vtavakkoli/QueryWeave.git#main
    container_name: queryweave_engine
    ports:
      - "4777:7777"
    environment:
      - QUERYWEAVE_ADDR=0.0.0.0:7777
      - QUERYWEAVE_LEXICAL_BACKEND=tantivy
      - QUERYWEAVE_VECTOR_BACKEND=hnsw-f32

  backend:
    build: ./backend
    container_name: hybrid_backend
    ports:
      - "4800:8000"
    depends_on:
      - qdrant
      - elasticsearch
      - queryweave
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ELASTIC_HOST=elasticsearch
      - ELASTIC_PORT=9200
      - QUERYWEAVE_URL=http://queryweave:7777
    volumes:
      - ./models_cache:/app/models_cache

  frontend:
    build: ./frontend
    container_name: hybrid_frontend
    ports:
      - "4300:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
